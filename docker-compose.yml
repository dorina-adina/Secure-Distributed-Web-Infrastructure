services:
 web1:
  build: .
  volumes:
   - ./app:/var/www/html
  networks:
   - app_network
  environment:
   - session.save_handler=redis
   - session.save_path=tcp://redis_cache:6379

 web2:
  build: .
  volumes:
   - ./app:/var/www/html
  networks:
   - app_network
  environment:
   - session.save_handler=redis
   - session.save_path=tcp://redis_cache:6379

 proxy:
  image: nginx:alpine
  ports:
   - "8080:80"
   - "8443:443"
  volumes:
   - ./nginx.conf:/etc/nginx/nginx.conf:ro
   - ./certs:/etc/nginx/certs:ro
   - ./app:/var/www/html
   - /dev/null:/etc/nginx/conf.d/default.conf:ro
  depends_on:
   - web1
   - web2
  networks:
   - app_network

 db_master:
  image: mysql:latest
  environment:
   MYSQL_ROOT_PASSWORD: root
   MYSQL_USER: admin
   MYSQL_PASSWORD: secret
   MYSQL_DATABASE: library_app_db
  volumes:
   - ./master_conf:/etc/mysql/conf.d
   - master_data:/var/lib/mysql
  networks:
   - app_network

 db_slave:
  image: mysql:latest
  depends_on:
   - db_master
  environment:
   MYSQL_ROOT_PASSWORD: root
  volumes:
   - ./slave_conf:/etc/mysql/conf.d
   - slave_data:/var/lib/mysql
  networks:
   - app_network

 phpmyadmin:
  image: phpmyadmin/phpmyadmin:latest
  environment:
   PMA_HOST: db_master
   PMA_USER: admin
   PMA_PASSWORD: secret
  ports:
   - "8888:80"
  networks:
   - app_network

 redis:
  image: redis:alpine
  container_name: redis_cache
  networks:
   - app_network

 mailpit:
  image: axllent/mailpit
  container_name: mailpit
  ports:
   - "8025:8025"
   - "1025:1025"
  networks:
   - app_network

 dozzle:
  image: amir20/dozzle:latest
  volumes:
   - /var/run/docker.sock:/var/run/docker.sock
  ports:
   - "8001:8080"
  networks:
   - app_network

networks:
 app_network:
  driver: bridge

volumes:
  master_data:
  slave_data:
